name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: macOS (Apple Silicon Darwin)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Node.js / npx
        run: |
          node --version
          npx --version

      - name: Pre-install MCP Everything Server (Pinned)
        run: npm install -g @modelcontextprotocol/server-everything@2026.8.31

      - name: Swift Version
        run: swift --version

      - name: Validate Package Manifest
        run: swift package dump-package > /dev/null

      - name: Build (Release)
        run: swift build -c release

      - name: Run Test Suite
        run: swift test --enable-code-coverage

  test-linux:
    name: Ubuntu Linux (Swift 6.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Node.js / npx
        run: |
          node --version
          npx --version

      - name: Pre-install MCP Everything Server (Pinned)
        run: npm install -g @modelcontextprotocol/server-everything@2026.8.31

      - name: Swift Version
        run: swift --version

      - name: Validate Package Manifest
        run: swift package dump-package > /dev/null

      - name: Validate Dashboard Server Syntax
        run: python3 -m py_compile dashboard/server/server.py

      - name: Build (Release)
        run: swift build -c release

      - name: Run Test Suite
        run: swift test --enable-code-coverage

