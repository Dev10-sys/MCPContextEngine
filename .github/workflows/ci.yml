name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: macOS (Apple Silicon Darwin)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Swift Version
        run: swift --version

      - name: Build (Release)
        run: swift build -c release

      - name: Run Test Suite
        run: swift test --enable-code-coverage

  test-linux:
    name: Ubuntu Linux (Swift 6.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Swift Version
        run: swift --version

      - name: Build (Release)
        run: swift build -c release

      - name: Run Test Suite
        run: swift test --enable-code-coverage
